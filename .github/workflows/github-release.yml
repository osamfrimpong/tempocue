name: GitHub Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare-release:
    name: Prepare release tag
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.release-tag.outputs.release-tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create next tag
        id: release-tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            existing_head_tag="$(git tag --points-at HEAD --list 'v*' | grep -E '^v[0-9]+(\.[0-9]+)+$' | sort -V | tail -n 1 || true)"

            if [[ -n "${existing_head_tag}" ]]; then
              release_tag="${existing_head_tag}"
            else
              latest_tag="$(git tag --list 'v*' | grep -E '^v[0-9]+(\.[0-9]+)+$' | sort -V | tail -n 1 || true)"

              if [[ -z "${latest_tag}" ]]; then
                release_tag="v$(node -p "require('./package.json').version")"
              else
                version_prefix="${latest_tag%.*}"
                version_patch="${latest_tag##*.}"
                release_tag="${version_prefix}.$((version_patch + 1))"
              fi

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag "${release_tag}"
              git push origin "${release_tag}"
            fi
          fi

          echo "release-tag=${release_tag}" >> "${GITHUB_OUTPUT}"

  build-installers:
    name: Build ${{ matrix.name }} installer
    runs-on: ${{ matrix.os }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundle: nsis
            artifact-name: TempoCue-windows-installer
            artifact-path: src-tauri/target/release/bundle/nsis/*.exe
            cache-prefix: windows-cargo
          - name: macOS Apple Silicon
            os: macos-15
            bundle: dmg
            artifact-name: TempoCue-macos-apple-silicon-installer
            artifact-path: src-tauri/target/release/bundle/dmg/*.dmg
            cache-prefix: macos-arm64-cargo
          - name: macOS Intel
            os: macos-15-intel
            bundle: dmg
            artifact-name: TempoCue-macos-intel-installer
            artifact-path: src-tauri/target/release/bundle/dmg/*.dmg
            cache-prefix: macos-x64-cargo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/registry/cache
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.cache-prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.cache-prefix }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-installers

    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.release-tag }}
          files: release-assets/*
          generate_release_notes: true
